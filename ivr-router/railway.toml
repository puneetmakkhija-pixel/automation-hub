# Read relative to this service's Root Directory, so it governs every service
# rooted at `ivr-router` other than `ivr-voice-bot-system` itself (that one is
# pinned to the repo root per README.md and keeps using the repo-root
# railway.toml's Docker build).
#
# Without this file, a service rooted here falls through to the repo-root
# railway.toml, which sets builder = "dockerfile", dockerfile = "Dockerfile".
# Resolved against this Root Directory that is `ivr-router/Dockerfile`, which
# DOES exist (unlike the equivalent case in data-jobs/railway.toml, where the
# missing file made the build fail loudly) -- so the build would succeed
# silently on the wrong image. That Dockerfile only COPYs index.js, lib/ and
# public/ for the always-on web server; it does not COPY scripts/, so
# `node scripts/pollVoiceOutcomesCron.js` would fail with a missing module at
# runtime, not at build time.
#
# Railpack builds this folder from its own package.json instead, the same
# pattern data-jobs/railway.toml uses for its three cron services.
[build]
builder = "railpack"
