# Railway Configuration for IVR Router

[build]
dockerfile = "Dockerfile"
context = "."

[deploy]
startCommand = "node index.js"
restartPolicyType = "always"
restartPolicyMaxRetries = 5

[env]
# Railway automatically exposes PORT and sets it to 3000
NODE_ENV = "production"
LOG_LEVEL = "info"

# Database connection (Railway provides DATABASE_URL)
# SUPABASE_URL will be set via Railway environment variables
# SUPABASE_KEY will be set via Railway environment variables
# SUPABASE_SERVICE_ROLE_KEY will be set via Railway environment variables

# Redis connection (Railway provides REDIS_URL if Redis is added to project)
# It will be automatically available as redis://default:password@host:port

# Claude API (set via Railway dashboard)
# CLAUDE_API_KEY will be set via Railway environment variables
# CLAUDE_MODEL will be set via Railway environment variables

# Ananta API (set via Railway dashboard)
# ANANTA_API_KEY will be set via Railway environment variables
# ANANTA_API_URL will be set via Railway environment variables

# SendGrid (set via Railway dashboard)
# SENDGRID_API_KEY will be set via Railway environment variables
# SENDGRID_FROM_EMAIL will be set via Railway environment variables

# Slack Webhooks (set via Railway dashboard)
# SLACK_WEBHOOK_URL will be set via Railway environment variables
# SLACK_WEBHOOK_REENGAGEMENT will be set via Railway environment variables
# SLACK_WEBHOOK_REJECTION will be set via Railway environment variables

[volumes]
# Optional: mount persistent storage if needed for logs
# "/app/logs" = "ivr-router-logs"

[processes]
# Single web process
web = "node index.js"

# Optional: worker process for BullMQ jobs
# worker = "node lib/workers/jobWorker.js"
