# Twice-daily Cron Status Monitoring Configuration
# Monitors all critical API pulls and cron jobs

cron_jobs:
  - name: "Morning Cron Status Check"
    schedule: "0 5 * * *" # 10:30 AM IST daily (5:00 AM UTC)
    job: "status-monitor"
    timeout: 300
    description: "Check status of all API pulls and cron jobs at 10:30 AM IST"

  - name: "Afternoon Cron Status Check"
    schedule: "30 8 * * *" # 2:00 PM IST daily (8:30 AM UTC)
    job: "status-monitor"
    timeout: 300
    description: "Check status of all API pulls and cron jobs at 2:00 PM IST"

monitored_jobs:
  api_pulls:
    - key: "digitap-bank-statement-parsing"
      name: "Digitap Bank Statement Parsing"
      description: "Parse bank statements via Digitap API"
      timeout_minutes: 60
      critical: true

    - key: "digitap-credit-bureau-analytics"
      name: "Digitap Credit Bureau Analytics"
      description: "Fetch credit analytics from Digitap bureau"
      timeout_minutes: 30
      critical: true

    - key: "digitap-mobile-to-prefilled"
      name: "Digitap Mobile to Pre-filled"
      description: "Pre-fill mobile verification data"
      timeout_minutes: 15
      critical: false

    - key: "digitap-gst-enhancement"
      name: "Digitap GST Enhancement"
      description: "Enhance GST data from Digitap API"
      timeout_minutes: 20
      critical: false

    - key: "digitap-pan-details-plus"
      name: "Digitap PAN Details Plus"
      description: "Fetch enhanced PAN details"
      timeout_minutes: 15
      critical: true

  cron_jobs:
    - key: "lender-mis-email-sync"
      name: "Lender MIS from Email Sync Up"
      description: "Sync MIS data from lender emails"
      timeout_minutes: 30
      critical: true

    - key: "email-cases-status-update"
      name: "Email Cases Status Update"
      description: "Update case statuses from email triggers"
      timeout_minutes: 20
      critical: true

    - key: "tl-wise-documents-upload"
      name: "TL Wise Documents Upload and Pendency"
      description: "Upload TL documents and track pendency"
      timeout_minutes: 40
      critical: true

    - key: "crm-cases-status-update"
      name: "Status Update of Cases in CRM"
      description: "Update case statuses in CRM system"
      timeout_minutes: 30
      critical: true

    - key: "all-reports-refresh"
      name: "All Reports Refresh"
      description: "Refresh all analytics reports"
      timeout_minutes: 60
      critical: true

    - key: "excel-upload-reported-numbers"
      name: "Excel Upload of Reported Numbers"
      description: "Upload reported numbers to Excel sheets"
      timeout_minutes: 25
      critical: false

alerting:
  enabled: true
  channels:
    - type: "email"
      recipients:
        - "${ALERT_EMAIL}"
      on_failure: true
      on_overdue: true

    - type: "slack"
      webhook_url: "${SLACK_WEBHOOK_URL}"
      on_failure: true
      on_overdue: true

  thresholds:
    failure_threshold: 1
    overdue_threshold: 1
